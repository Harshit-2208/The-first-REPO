<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Fire 🔥</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HUD sits above the canvas, absolutely positioned -->
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score">0</span>
    </div>
    <div class="hud-item hud-level">
      <span class="hud-label">Level</span>
      <span class="hud-val" id="levelDisplay">Lv 1</span>
      <div class="level-bar-track"><div class="level-bar-fill" id="levelBar"></div></div>
    </div>
    <div class="hud-item">
      <span class="hud-label">Best</span>
      <span class="hud-val" id="bestScore">0</span>
    </div>
  </div>

  <!-- Full-screen canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Start overlay -->
  <div class="overlay" id="startScreen">
    <div class="overlay-box">
      <div class="bird-icon">🐦</div>
      <h2>Flappy Fire</h2>
      <p>Dodge the flamethrowers across <strong>5 levels</strong></p>
      <div class="level-list">
        <span>🥉 Ember Cave</span>
        <span>🥈 Inferno Shaft</span>
        <span>🏅 Magma Core</span>
        <span>🎖️ Void Furnace</span>
        <span>🏆 Hellfire Apex</span>
      </div>
      <p class="hint-text"><strong>Space / W / ↑ / Tap</strong> — hold for extra lift</p>
      <button class="game-btn" id="startBtn">▶ Start Game</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div class="overlay" id="gameOverScreen">
    <div class="overlay-box">
      <div class="bird-icon">💀</div>
      <h2>Game Over</h2>
      <p class="final-score">Score: <span id="finalScore">0</span></p>
      <p class="final-level" id="finalLevel"></p>
      <p class="best-label" id="newBestLabel"></p>
      <button class="game-btn" id="restartBtn">🔄 Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
