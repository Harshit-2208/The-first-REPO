<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Fire 🔥</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HUD sits above the canvas, absolutely positioned -->
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score">0</span>
    </div>

    <div class="hud-item">
      <span class="hud-label">Best</span>
      <span class="hud-val" id="bestScore">0</span>
    </div>
  </div>

  <!-- Full-screen canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Start overlay -->
  <div class="overlay" id="startScreen">
    <div class="overlay-box">
      <div class="bird-icon">🐦</div>
      <h2>Flappy Fire</h2>
      <p>Dodge the flamethrowers in this <strong>endless run!</strong></p>
      <div class="level-list">
        <span>🔥 How far can you go?</span>
      </div>
      <p class="hint-text"><strong>Space / W / ↑ / Tap</strong> — hold for extra lift</p>
      <button class="game-btn" id="startBtn">▶ Start Game</button>
    </div>
  </div>

  <!-- Game over overlay -->
  <div class="overlay" id="gameOverScreen">
    <div class="overlay-box">
      <div class="bird-icon">💀</div>
      <h2>Game Over</h2>
      <p class="final-score">Score: <span id="finalScore">0</span></p>

      <p class="best-label" id="newBestLabel"></p>
      <button class="game-btn" id="restartBtn">🔄 Play Again</button>
    </div>
  </div>

  <audio id="scoreSound" src="Aag.mp3" preload="auto"></audio>
  <audio id="deathSound" src="death_sound.mp3" preload="auto"></audio>
  <script src="game.js"></script>
</body>
</html>
